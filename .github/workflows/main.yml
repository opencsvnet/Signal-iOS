name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/*

# On PRs, "head_ref" is defined and is consistent across updates. On
# pushes, it's not defined, so we use "run_id", which is unique across
# every run; as a result, all actions on pushes will run to completion.
#
# Reference: https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Path format pulled from https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#xcode
  DEVELOPER_DIR: /Applications/Xcode_26.6.app

jobs:
  build_and_test:
    name: Build and Test
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, x86_64, signal-ios]
    env:
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 7

    strategy:
      matrix:
        # Add additional Xcode versions here if necessary.
        xcode: ["Xcode_26.6"]

    steps:
      - name: Select installed Xcode 26.6
        shell: bash
        run: |
          shopt -s nullglob
          expected=$(<.xcode-version)
          selected=
          for candidate in /Applications/Xcode*.app; do
            actual=$(DEVELOPER_DIR="$candidate" xcodebuild -version 2>/dev/null | head -n 1 || true)
            echo "$candidate: ${actual:-unusable}"
            if [[ "$actual" == "$expected" ]]; then
              selected=$candidate
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "No installed Xcode matches $expected" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - name: Check Xcode version
        run: |
          Scripts/check_xcode_version.py --relaxed

      - name: Download Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Download iOS runtime
        run: |
          xcodebuild -downloadPlatform iOS

      - uses: ./.github/actions/clone-everything
        with:
          access-token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 # Reads .ruby-version file by default
        with:
          bundler-cache: true

      - name: Synchronize CocoaPods workspace
        run: |
          bundle exec pod install --deployment
          git diff --exit-code -- Podfile.lock

      - name: Verify Signal has no issuer capability
        shell: bash
        run: |
          archive=$(find Pods -path '*/OpenCsv.xcframework/*simulator*/libopencsv_ffi.a' -print -quit)
          header=$(find Pods -path '*/OpenCsv.xcframework/*/Headers/opencsv.h' -print -quit)
          test -n "$archive" && test -n "$header"
          if strings "$archive" | grep -Eq 'opencsv_wallet_init_issuer|opencsv_prove_mint'; then
            echo "issuer capability leaked into Signal's default OpenCSV framework" >&2
            exit 1
          fi
          if grep -Eq 'opencsv_wallet_init_issuer|opencsv_prove_mint' "$header"; then
            echo "issuer API leaked into Signal's default OpenCSV header" >&2
            exit 1
          fi

      - name: Build and Test
        run: Scripts/build-and-test.sh

      - name: Upload build logs
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: Logs
          path: ~/Library/Logs/Signal-CI

      - name: Normalize database schema
        run: |
          touch -d 2026-01-01T00:00:00 ~/Library/Signal-iOS-Schema/schema.json

      - name: Upload database schema
        uses: actions/upload-artifact@v6
        with:
          name: Database Schema
          path: ~/Library/Signal-iOS-Schema

  check_autogenstrings:
    name: Check if strings file is outdated

    timeout-minutes: 10

    runs-on: macos-26

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Run genstrings
        run: Scripts/translation/auto-genstrings

      - name: Check for any changes
        run: git diff --exit-code

  opencsv_recovery_build:
    name: OpenCSV recovery build
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, x86_64, signal-ios]

    steps:
      - name: Select installed Xcode 26.6
        shell: bash
        run: |
          shopt -s nullglob
          expected=$(<.xcode-version)
          selected=
          for candidate in /Applications/Xcode*.app; do
            actual=$(DEVELOPER_DIR="$candidate" xcodebuild -version 2>/dev/null | head -n 1 || true)
            echo "$candidate: ${actual:-unusable}"
            if [[ "$actual" == "$expected" ]]; then
              selected=$candidate
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "No installed Xcode matches $expected" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - name: Check Xcode version
        run: Scripts/check_xcode_version.py --relaxed

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - uses: ./.github/actions/clone-everything
        with:
          access-token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Checkout the exact pinned OpenCSV source
        shell: bash
        run: |
          revision=$(ruby -ne 'puts $1 if $_ =~ /pod .OpenCsv.*commit: .([0-9a-f]{40})./' Podfile)
          test "${#revision}" -eq 40
          rust_root="$RUNNER_TEMP/opencsv-rs"
          git init "$rust_root"
          git -C "$rust_root" remote add origin https://github.com/opencsvnet/opencsv-rs.git
          git -C "$rust_root" fetch --depth 1 origin "$revision"
          git -C "$rust_root" checkout --detach FETCH_HEAD
          test "$(git -C "$rust_root" rev-parse HEAD)" = "$revision"
          echo "OPENCSV_LOCAL_RUST_PATH=$rust_root" >> "$GITHUB_ENV"

      - name: Build DEBUG-only recovery configuration
        env:
          OPENCSV_DERIVED_DATA_PATH: ${{ runner.temp }}/OpenCsvRecoveryDerivedData
        run: Scripts/build-opencsv-test-wallet-recovery.sh
