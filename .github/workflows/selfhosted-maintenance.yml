name: self-hosted maintenance

on:
  workflow_dispatch:
    inputs:
      target:
        description: Runner to open for maintenance
        required: true
        default: runner-1
        type: choice
        options:
          - runner-1
          - macvm-0

permissions:
  contents: read

jobs:
  runner-1:
    name: runner-1 maintenance
    if: inputs.target == 'runner-1'
    runs-on: [self-hosted, runner-1-signal]
    timeout-minutes: 120
    steps:
      - name: Clear stale continuation marker
        run: rm -f "$GITHUB_WORKSPACE/continue"

      - name: Actor-restricted maintenance shell
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        with:
          limit-access-to-actor: true
          sudo: false

  macvm-0:
    name: macvm-0 maintenance
    if: inputs.target == 'macvm-0'
    runs-on: [self-hosted, macvm-0-signal]
    timeout-minutes: 120
    steps:
      - name: Clear stale continuation marker
        run: rm -f "$GITHUB_WORKSPACE/continue"

      - name: Actor-restricted maintenance shell
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        with:
          limit-access-to-actor: true
          sudo: false
